# Application configuration.
#
# Read this file top to bottom once before you start. Nearly every "why does it
# not work" in early Zephyr is a missing line here, and nearly every one of
# those lines has a comment below explaining what it buys you.
#
# Anything you can set here you can also override for one build with
# -DCONFIG_X=y on the west command line, which is the fast way to experiment
# without editing the file.

# --- Logging: over RTT, not over the USB port -------------------------------
# The host's USB serial port is DATA. If log text went out of the same port it
# would corrupt the byte stream the laptop is trying to decode, so logs go out
# of the SWD debug probe over SEGGER RTT instead. Read them with
# scripts/flash.sh, which leaves an RTT logger running.
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# The board's own defaults assume the console is on USB and therefore delay the
# log thread by four seconds at boot, waiting for a host to open the port. We
# log over RTT, so that delay would only hide our boot messages.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=0

# --- USB device: the one port the host sees ---------------------------------
# The board already declares a CDC-ACM instance in its devicetree (node label
# cdc_acm_uart0), so all that is left is to build the stack and name the device
# in the descriptor the host reads.
#
# INITIALIZE_AT_BOOT is deliberately OFF: src/main.c calls usb_enable() itself,
# so the sequence is visible in code you can read and breakpoint rather than
# happening invisibly before main() runs.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_DEVICE_MANUFACTURER="MCRI"
CONFIG_USB_DEVICE_PRODUCT="CBPM dongle"

# --- Serial drivers ----------------------------------------------------------
# Two different UART APIs, one per link, and the reason is throughput:
#
#   INTERRUPT_DRIVEN -- used for USB CDC-ACM, which is the only API that driver
#   supports. One interrupt per chunk, you copy bytes in and out of a FIFO.
#
#   ASYNC_API -- used for the wired link to Roo. The nRF UARTE peripheral moves
#   bytes with DMA and interrupts you once per buffer. At 1 Mbaud the wire
#   delivers 100 000 bytes a second; one interrupt per byte would eat the CPU
#   alive, so DMA is not an optimisation here, it is the only workable choice.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_ASYNC_API=y

# Lets cdc_link_host_present() ask whether the host has actually opened the
# port (the DTR line). Without this the query returns -ENOSYS and you cannot
# tell "no host listening" apart from "my firmware is broken".
CONFIG_UART_LINE_CTRL=y

# --- Kernel bits the code uses ----------------------------------------------
CONFIG_RING_BUFFER=y
CONFIG_GPIO=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_THREAD_NAME=y
CONFIG_MAIN_STACK_SIZE=2048

# Assertions cost flash and a little speed, and catch your mistakes early. Keep
# them on while you are learning; a production image would turn them off.
CONFIG_ASSERT=y

# --- Milestone switches ------------------------------------------------------
# M5 turns the radio on. It stays off until then so the build is quick and
# there is one less moving part underneath you.
# CONFIG_CBPM_DONGLE_BLE=y

# M6 adds the watchdog. TASK_WDT needs the hardware watchdog driver underneath
# it, which is what CONFIG_WATCHDOG buys. Uncomment both together.
# CONFIG_WATCHDOG=y
# CONFIG_TASK_WDT=y
