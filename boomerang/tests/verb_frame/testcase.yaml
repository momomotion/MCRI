# Twister needs this file to know the test exists and where it may run.
# `unit_testing` is the host platform: no board, no emulator, just a native
# binary. Restricting the platform here means `west twister -T tests` will not
# try to build this for an nRF52840 and fail confusingly.

tests:
  dongle.verb_frame:
    platform_allow: unit_testing
    tags:
      - protocol
      - unit
